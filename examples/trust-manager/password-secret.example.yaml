# EXAMPLE ONLY: create this Secret securely in the trust namespace.
# trust-manager uses a password Secret specified at installation time;
# the password is not declared on each Bundle.
apiVersion: v1
kind: Secret
metadata:
  name: truststore-password
  namespace: trust-system
type: Opaque
stringData:
  password: REPLACE_WITH_STRONG_SECRET_FROM_EXTERNAL_SECRET_MANAGER
